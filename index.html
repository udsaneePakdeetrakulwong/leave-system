<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>แบบฟอร์มแจ้งข้อมูล</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-frame {
            width: 100%;
            min-height: 900px;
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .form-frame {
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <iframe
            class="form-frame"
            src="https://script.google.com/macros/s/AKfycbzgGM-49xjvLoiXt3rcONTuELtV8OCuWL6g7gz3ps_yXat9sSSKPScso89QaUtEe4hB0Q/exec"
            title="แบบฟอร์มแจ้งข้อมูล"
            loading="lazy">
        </iframe>
    </main>

</body>

</html>
